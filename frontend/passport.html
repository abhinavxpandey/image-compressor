
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passport Photo Generator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 60px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 30px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input,
        button {
            padding: 10px;
            font-size: 16px;
        }

        button {
            cursor: pointer;
        }

        #result {
            margin-top: 30px;
        }

        #preview {
            max-width: 100%;
            border: 1px solid #ccc;
            display: none;
        }

        #download {
            display: none;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <h1>Passport Photo Generator</h1>

    <form id="passportForm">

        <label>
            Select passport photo:
        </label>

        <input
            type="file"
            name="passport"
            accept="image/*"
            required
        >

        <label>
            Number of copies:
        </label>

        <input
            type="number"
            name="copies"
            min="1"
            value="6"
            required
        >

        <button type="submit">
            Generate A4
        </button>

    </form>

    <div id="result">
        <h2>Result</h2>

        <img id="preview">

        <br>

        <a id="download" download="passport-a4.jpg">
            Download A4
        </a>
    </div>


    <script>

        const form = document.getElementById("passportForm");
        const preview = document.getElementById("preview");
        const download = document.getElementById("download");

        form.addEventListener("submit", async (e) => {

            e.preventDefault();

            const formData = new FormData(form);

            try {

                const response = await fetch("https://image-compressor-fcbs.onrender.com/upload", {
                    method: "POST",
                    body: formData
                });

                if (!response.ok) {

                    const error = await response.json();

                    alert(error.error || "Something went wrong.");

                    return;
                }

                const blob = await response.blob();

                const imageURL = URL.createObjectURL(blob);

                
                preview.src = imageURL;
                preview.style.display = "block";

                
                download.href = imageURL;
                download.style.display = "inline-block";

            } catch (error) {

                console.error(error);

                alert("Could not connect to the server.");

            }

        });

    </script>

</body>
</html>
